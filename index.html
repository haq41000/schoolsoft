<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>SchoolSoft</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#14213d">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f2f5fb;--card:#fff;--tx:#1b2333;--mut:#667;--pri:#1e4fd8;--bd:#d9deea;--sd:#14213d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141d;--card:#1a2030;--tx:#eef1f8;--mut:#9aa4bb;--bd:#2c354a;--sd:#0a0f1c}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Arial,sans-serif}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sd);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top button{width:auto;margin:0;padding:6px 12px;background:#ffffff22}
.side{position:fixed;left:-240px;top:0;bottom:0;width:230px;background:var(--sd);padding:56px 8px 8px;transition:left .2s;z-index:4;overflow:auto}
.side.o{left:0}.side button{display:block;width:100%;text-align:left;background:transparent;color:#cfd8ee;margin:2px 0;padding:12px}
.side button.a{background:#ffffff22;color:#fff}
main{padding:14px;max-width:900px;margin:0 auto}
@media(min-width:800px){.side{left:0;padding-top:70px}main{margin-left:240px}.top{padding-left:250px}.top .mb{display:none}}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
h1{font-size:21px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}p{color:var(--mut);margin:4px 0}
label{display:block;margin:10px 0 4px;font-size:14px}
input,select,textarea{width:100%;padding:11px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button{width:100%;margin-top:10px;padding:12px;font-size:16px;border:0;border-radius:8px;background:var(--pri);color:#fff}
button.s{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g .c{margin:0}.g b{font-size:19px;display:block;margin-top:4px}
.t{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
td button{margin:0;padding:6px 10px;font-size:13px;width:auto}
.m{margin-top:10px;font-size:14px}.ok{color:#128a3e}.er{color:#d22}
.rc{border:2px dashed var(--bd);padding:14px}
@media print{.top,.side,.np{display:none!important}main{margin:0}body{background:#fff;color:#000}}
</style></head><body><div id="app"></div>
<script>
var K="schoolsoft_v2",D=null,auth=false,V="dash",busy=false,RID=null;
function ld(){try{var r=localStorage.getItem(K);if(r){D=JSON.parse(r);return}var o=localStorage.getItem("schoolsoft_v1");if(o){var s=JSON.parse(o);D={school:s.school,currency:s.currency||"PKR",salt:s.salt,pw:s.pw,classes:[],students:[],charges:[],pays:[],seq:{reg:1,rec:1}};sv()}}catch(e){D=null}}
function sv(){try{localStorage.setItem(K,JSON.stringify(D));return true}catch(e){alert("Could not save data. Please do not use Private/Incognito mode.");return false}}
async function H(p,s){var t=s+":"+p;try{var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}catch(e){var h=5381;for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return "f"+h}}
function slt(){var s="";for(var i=0;i<16;i++)s+=Math.floor(Math.random()*16).toString(16);return s}
function $(i){return document.getElementById(i)}
function E(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function M(t,ok){var m=$("m");if(m){m.className="m "+(ok?"ok":"er");m.textContent=t}}
function fm(n){return D.currency+" "+Number(n).toLocaleString()}
function today(){return new Date().toISOString().slice(0,10)}
function cn(id){var c=D.classes.filter(function(x){return x.id==id})[0];return c?c.name:"-"}
function pend(sid){var a=0;D.charges.forEach(function(c){if(c.sid==sid)a+=c.amt});D.pays.forEach(function(p){if(p.sid==sid)a-=p.amt+p.disc});return a}
var PUB={"kty":"EC","x":"8lld6xSOyXo-ETYMPAfobYVR1Kat6xFYawaVe6NMLVE","y":"nrY8aeIczGMQ6e1DVgtsZlU_DfSGA6Y6wv-09Jz7lQw","crv":"P-256"},LIC=false;
function devId(){try{var d=localStorage.getItem("schoolsoft_dev");if(!d){var a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",x="";for(var i=0;i<12;i++)x+=a[Math.floor(Math.random()*a.length)];d=x.slice(0,4)+"-"+x.slice(4,8)+"-"+x.slice(8);localStorage.setItem("schoolsoft_dev",d)}return d}catch(e){return"NO-STORAGE"}}
function b2u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function vlic(k){try{var key=await crypto.subtle.importKey("jwk",PUB,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);return await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,b2u(k.trim()),new TextEncoder().encode("SCHOOL|"+devId()))}catch(e){return false}}
async function actv(){var k=$("lk").value.trim();if(await vlic(k)){try{localStorage.setItem("schoolsoft_lic",k)}catch(e){}LIC=true;R()}else M("This key is not correct for this device. Please copy the full key again.")}
async function initLic(){var k="";try{k=localStorage.getItem("schoolsoft_lic")||""}catch(e){}LIC=k?await vlic(k):false;R()}
function R(){
 var a=$("app");if(!LIC){a.innerHTML='<main><h1>Activate SchoolSoft</h1><div class="c"><h2>Your Device ID</h2><p style="font-size:22px;color:var(--tx)"><b>'+devId()+'</b></p><p>Send this Device ID to Haq on WhatsApp to get your activation key.</p><label>Activation key</label><textarea id="lk" rows="4"></textarea><button onclick="actv()">Activate</button><div id="m" class="m"></div></div></main>';return}if(D){["att","staff","spay","exams","marks","exp"].forEach(function(k){if(!D[k])D[k]=[]});if(!D.gs)D.gs="80:A+,70:A,60:B,50:C,40:D,0:F";if(D.pass==null)D.pass=40}
 if(!D){a.innerHTML='<main><h1>Welcome to SchoolSoft</h1><div class="c"><h2>First-time setup</h2><label>School name</label><input id="n"><label>Create admin password (min 6)</label><input id="p" type="password"><label>Repeat password</label><input id="p2" type="password"><button onclick="setup()">Save and start</button><div id="m" class="m"></div><p>Currency: PKR</p></div></main>';return}
 if(!auth){a.innerHTML='<main><h1>'+E(D.school)+'</h1><div class="c"><h2>Login</h2><label>Admin password</label><input id="p" type="password"><button onclick="login()">Login</button><div id="m" class="m"></div></div></main>';return}
 var nav=[["dash","Dashboard"],["stu","Students"],["add","New Admission"],["att","Attendance"],["fee","Fee Collection"],["rec","Receipts"],["exm","Exams & Results"],["stf","Staff & Salary"],["exp","Expenses / Cashbook"],["cls","Classes"],["bak","Backup / Restore"],["set","Settings"]];
 a.innerHTML='<div class="top"><button class="mb" onclick="$(\'sd\').classList.toggle(\'o\')">☰</button><b>'+E(D.school)+'</b></div><div class="side" id="sd">'+nav.map(function(n){return'<button class="'+(V==n[0]?"a":"")+'" onclick="go(\''+n[0]+'\')">'+n[1]+'</button>'}).join("")+'<button onclick="auth=false;R()">Logout</button></div><main id="mn"></main>';
 var f={dash:vDash,stu:vStu,add:vAdd,edt:vEdt,est:vEst,att:vAtt,exm:vExm,mk:vMk,rs:vRs,rc:vRc,stf:vStf,exp:vExp,fee:vFee,rec:vRec,cls:vCls,bak:vBak,set:vSet,rcp:vRcp}[V];$("mn").innerHTML=f();if(V=="stu")lst();if(V=="fee")fpick();if(V=="att"&&D.classes.length){alist();arep()}}
function go(v){V=v;R();window.scrollTo(0,0)}
async function setup(){var n=$("n").value.trim(),p=$("p").value;if(!n)return M("Please type the school name.");if(p.length<6)return M("Password must be at least 6 characters.");if(p!==$("p2").value)return M("Passwords do not match.");var s=slt();D={school:n,currency:"PKR",salt:s,pw:await H(p,s),classes:[],students:[],charges:[],pays:[],seq:{reg:1,rec:1}};if(!sv()){D=null;return}auth=true;R()}
async function login(){if(await H($("p").value,D.salt)===D.pw){auth=true;R()}else M("Wrong password.")}
async function chk(id){return (await H($(id).value,D.salt))===D.pw}
function vDash(){var t=today(),mo=t.slice(0,7),td=0,tm=0,pd=0,df=0;D.pays.forEach(function(p){if(p.date==t)td+=p.amt;if(p.date.slice(0,7)==mo)tm+=p.amt});D.students.forEach(function(s){var x=pend(s.id);if(x>0){pd+=x;df++}});
 return'<h1>Dashboard</h1><div class="g"><div class="c">Students<b>'+D.students.filter(function(s){return !s.left}).length+'</b></div><div class="c">Classes<b>'+D.classes.length+'</b></div><div class="c">Today collection<b>'+fm(td)+'</b></div><div class="c">This month<b>'+fm(tm)+'</b></div><div class="c">Total pending<b>'+fm(pd)+'</b></div><div class="c">Defaulters<b>'+df+'</b></div><div class="c">Present today<b>'+D.att.filter(function(a){return a.d==t&&(a.st=="P"||a.st=="L")}).length+'</b></div></div><div class="c" style="margin-top:14px"><h2>Quick start</h2><p>1) Add classes 2) Admit students 3) Generate monthly fees 4) Collect fee.</p></div>'}
function vCls(){return'<h1>Classes</h1><div class="c"><label>New class name (e.g. Class 1)</label><input id="cname"><button onclick="addCls()">Add class</button><div id="m" class="m"></div></div><div class="c t"><table><tr><th>Class</th><th>Students</th></tr>'+D.classes.map(function(c){return'<tr><td>'+E(c.name)+'</td><td>'+D.students.filter(function(s){return s.cid==c.id&&!s.left}).length+'</td></tr>'}).join("")+'</table></div>'}
function addCls(){var n=$("cname").value.trim();if(!n)return M("Type a class name.");if(D.classes.some(function(c){return c.name.toLowerCase()==n.toLowerCase()}))return M("This class already exists.");D.classes.push({id:Date.now(),name:n});sv();R()}
function vAdd(){if(!D.classes.length)return'<h1>New Admission</h1><div class="c"><p>Please add a class first.</p><button onclick="go(\'cls\')">Go to Classes</button></div>';
 return'<h1>New Admission</h1><div class="c"><label>Student name *</label><input id="sn"><label>Father name</label><input id="sf"><label>Phone</label><input id="sp" type="tel"><label>Class *</label><select id="sc">'+D.classes.map(function(c){return'<option value="'+c.id+'">'+E(c.name)+'</option>'}).join("")+'</select><label>Monthly fee ('+E(D.currency)+') *</label><input id="sm" type="number" min="0"><button onclick="addStu()">Save admission</button><div id="m" class="m"></div></div>'}
function addStu(){var n=$("sn").value.trim(),f=Number($("sm").value);if(!n)return M("Student name is required.");if(!(f>=0)||$("sm").value==="")return M("Enter the monthly fee.");var r="R-"+String(D.seq.reg).padStart(4,"0");D.seq.reg++;D.students.push({id:Date.now(),reg:r,name:n,father:$("sf").value.trim(),phone:$("sp").value.trim(),cid:$("sc").value,fee:f,date:today()});sv();alert("Admitted. Reg No: "+r);go("stu")}
function vStu(){return'<h1>Students</h1><div class="c"><input id="q" placeholder="Search name, reg no, father, phone" oninput="lst()"><label>Show</label><select id="sf" onchange="lst()"><option value="a">Active students</option><option value="l">Left students</option><option value="x">All</option></select></div><div class="c t" id="sl"></div>'}
function lst(){var q=($("q").value||"").toLowerCase(),f=$("sf").value,h='<table><tr><th>Reg</th><th>Name</th><th>Class</th><th>Father</th><th>Phone</th><th>Pending</th><th></th></tr>';D.students.filter(function(s){return(f=="x"||(f=="l")==!!s.left)&&(s.reg+s.name+s.father+s.phone).toLowerCase().indexOf(q)>-1}).slice(0,200).forEach(function(s){h+='<tr><td>'+s.reg+'</td><td>'+E(s.name)+(s.left?" (left)":"")+'</td><td>'+E(cn(s.cid))+'</td><td>'+E(s.father)+'</td><td>'+E(s.phone)+'</td><td>'+fm(pend(s.id))+'</td><td><button onclick="SEL='+s.id+';go(\'fee\')">Collect</button> <button onclick="ESID='+s.id+';go(\'edt\')">Edit</button></td></tr>'});$("sl").innerHTML=h+'</table>'}
var SEL=null;
function vFee(){var m=today().slice(0,7);return'<h1>Fee Collection</h1><div class="c"><h2>1. Generate monthly fees</h2><label>Month</label><input id="gm" type="month" value="'+m+'"><button class="s" onclick="gen()">Generate for all students</button><div id="m" class="m"></div></div><div class="c"><h2>2. Collect fee</h2><input id="fq" placeholder="Search student" oninput="fpick()"><label>Student</label><select id="fs" onchange="SEL=this.value;finfo()"></select><div id="fi"></div></div>'}
function fpick(){var q=($("fq").value||"").toLowerCase(),o="";D.students.filter(function(s){return(s.reg+s.name+s.father).toLowerCase().indexOf(q)>-1}).slice(0,100).forEach(function(s){o+='<option value="'+s.id+'"'+(s.id==SEL?" selected":"")+'>'+s.reg+" - "+E(s.name)+(s.left?" (left)":"")+'</option>'});$("fs").innerHTML=o||'<option value="">No student found</option>';if(!SEL||!D.students.some(function(s){return s.id==SEL&&$("fs").value==s.id}))SEL=$("fs").value;finfo()}
function finfo(){var s=D.students.filter(function(x){return x.id==SEL})[0],b=$("fi");if(!s){b.innerHTML="";return}var p=pend(s.id);b.innerHTML='<p>Class: '+E(cn(s.cid))+' | Monthly fee: '+fm(s.fee)+'</p><p><b>Pending: '+fm(p)+'</b></p><label>Amount received</label><input id="fa" type="number" min="0"><label>Discount (optional)</label><input id="fd" type="number" min="0" value="0"><label>Note (optional)</label><input id="fn"><button onclick="pay()">Save payment and make receipt</button><div id="m" class="m"></div>'}
function gen(){var mo=$("gm").value;if(!mo)return M("Choose a month.");var n=0;D.students.forEach(function(s){if(s.left)return;if(!D.charges.some(function(c){return c.sid==s.id&&c.month==mo})){D.charges.push({id:Date.now()+n,sid:s.id,month:mo,amt:s.fee});n++}});sv();M(n+" fee(s) generated for "+mo+(n?"":" (already generated before)"),true)}
function pay(){if(busy)return;var s=D.students.filter(function(x){return x.id==SEL})[0],a=Number($("fa").value)||0,d=Number($("fd").value)||0;if(a<0||d<0||a+d<=0)return M("Enter an amount.");if(a+d>pend(s.id))return M("Amount plus discount is more than the pending "+fm(pend(s.id))+".");busy=true;var rn="RC-"+String(D.seq.rec).padStart(5,"0");D.seq.rec++;var id=Date.now();D.pays.push({id:id,rno:rn,sid:s.id,amt:a,disc:d,date:today(),note:$("fn").value.trim()});var ok=sv();busy=false;if(!ok)return;RID=id;V="rcp";R()}

function copt(){return D.classes.map(function(c){return'<option value="'+c.id+'">'+E(c.name)+'</option>'}).join("")}
function vAtt(){if(!D.classes.length)return'<h1>Attendance</h1><div class="c"><p>Please add a class first.</p></div>';return'<h1>Attendance</h1><div class="c"><label>Class</label><select id="ac" onchange="alist();arep()">'+copt()+'</select><label>Date</label><input id="ad" type="date" value="'+today()+'" onchange="alist()"><div id="al"></div></div><div class="c"><h2>Monthly report</h2><label>Month</label><input id="am" type="month" value="'+today().slice(0,7)+'" onchange="arep()"><div class="t" id="ar"></div></div>'}
function alist(){var c=$("ac").value,d=$("ad").value,st=D.students.filter(function(s){return s.cid==c&&!s.left});if(!st.length){$("al").innerHTML='<p>No students in this class.</p>';return}var h='<table>';st.forEach(function(s){var e=D.att.filter(function(a){return a.d==d&&a.sid==s.id})[0],v=e?e.st:"P";h+='<tr><td>'+E(s.name)+'</td><td><select id="s_'+s.id+'"><option value="P"'+(v=="P"?" selected":"")+'>Present</option><option value="A"'+(v=="A"?" selected":"")+'>Absent</option><option value="L"'+(v=="L"?" selected":"")+'>Late</option><option value="V"'+(v=="V"?" selected":"")+'>Leave</option></select></td></tr>'});$("al").innerHTML=h+'</table><button onclick="asave()">Save attendance</button><div id="m" class="m"></div>'}
function asave(){var c=$("ac").value,d=$("ad").value;if(!d)return M("Choose a date.");var ids=D.students.filter(function(s){return s.cid==c&&!s.left}).map(function(s){return s.id});D.att=D.att.filter(function(a){return !(a.d==d&&ids.indexOf(a.sid)>-1)});ids.forEach(function(i){D.att.push({d:d,sid:i,st:$("s_"+i).value})});if(sv()){arep();M("Attendance saved for "+d,true)}}
function arep(){var c=$("ac").value,m=$("am").value,h='<table><tr><th>Student</th><th>P</th><th>A</th><th>Late</th><th>Leave</th><th>%</th></tr>';D.students.filter(function(s){return s.cid==c&&!s.left}).forEach(function(s){var n={P:0,A:0,L:0,V:0};D.att.forEach(function(a){if(a.sid==s.id&&a.d.slice(0,7)==m)n[a.st]++});var t=n.P+n.A+n.L+n.V;h+='<tr><td>'+E(s.name)+'</td><td>'+n.P+'</td><td>'+n.A+'</td><td>'+n.L+'</td><td>'+n.V+'</td><td>'+(t?Math.round((n.P+n.L)*100/t)+"%":"-")+'</td></tr>'});$("ar").innerHTML=h+'</table>'}

var EID=null,CSID=null;
function gr(p){var a=D.gs.split(",").map(function(x){var q=x.split(":");return{m:Number(q[0]),g:(q[1]||"").trim()}}).sort(function(a,b){return b.m-a.m});for(var i=0;i<a.length;i++)if(p>=a[i].m)return a[i].g;return"-"}
function ex(){return D.exams.filter(function(e){return e.id==EID})[0]}
function mkv(e,s,i){var r=D.marks.filter(function(x){return x.e==e&&x.s==s&&x.i==i})[0];return r?r.m:""}
function vExm(){if(!D.classes.length)return'<h1>Exams</h1><div class="c"><p>Please add a class first.</p></div>';return'<h1>Exams & Results</h1><div class="c"><h2>New exam</h2><label>Exam name</label><input id="en" placeholder="Mid Term"><label>Class</label><select id="ec">'+copt()+'</select><label>Subjects:max marks</label><input id="es" placeholder="Math:100,English:100,Urdu:50"><button onclick="addEx()">Create exam</button><div id="m" class="m"></div></div><div class="c t"><table><tr><th>Exam</th><th>Class</th><th></th></tr>'+D.exams.map(function(e){return'<tr><td>'+E(e.name)+'</td><td>'+E(cn(e.cid))+'</td><td><button onclick="EID='+e.id+';go(\'mk\')">Marks</button> <button onclick="EID='+e.id+';go(\'rs\')">Results</button></td></tr>'}).join("")+'</table></div>'}
function addEx(){var n=$("en").value.trim(),sj=[];if(!n)return M("Type the exam name.");var ok=$("es").value.split(",").every(function(x){var q=x.split(":"),m=Number(q[1]);if(q[0].trim()&&m>0){sj.push({n:q[0].trim(),max:m});return true}return false});if(!ok||!sj.length)return M("Subjects format: Math:100,English:100");D.exams.push({id:Date.now(),name:n,cid:$("ec").value,sj:sj});sv();R()}
function vMk(){var e=ex(),st=D.students.filter(function(s){return s.cid==e.cid&&!s.left});if(!st.length)return'<h1>Marks</h1><div class="c"><p>No students in this class.</p></div>';var h='<h1>'+E(e.name)+' - Marks</h1><div class="c t"><table><tr><th>Student</th>'+e.sj.map(function(j){return'<th>'+E(j.n)+' /'+j.max+'</th>'}).join("")+'</tr>';st.forEach(function(s){h+='<tr><td>'+E(s.name)+'</td>'+e.sj.map(function(j,i){return'<td><input style="width:80px" type="number" min="0" max="'+j.max+'" id="k_'+s.id+'_'+i+'" value="'+mkv(e.id,s.id,i)+'"></td>'}).join("")+'</tr>'});return h+'</table></div><button onclick="saveMk()">Save marks</button><div id="m" class="m"></div>'}
function saveMk(){var e=ex(),bad=false,n=[];D.students.filter(function(s){return s.cid==e.cid&&!s.left}).forEach(function(s){e.sj.forEach(function(j,i){var v=$("k_"+s.id+"_"+i).value;if(v==="")return;v=Number(v);if(v<0||v>j.max)bad=true;n.push({e:e.id,s:s.id,i:i,m:v})})});if(bad)return M("A mark is more than the maximum marks. Please correct it.");D.marks=D.marks.filter(function(x){return x.e!=e.id}).concat(n);if(sv())M("Marks saved.",true)}
function calc(e){var rows=D.students.filter(function(s){return s.cid==e.cid&&!s.left}).map(function(s){var t=0,mx=0;e.sj.forEach(function(j,i){var v=mkv(e.id,s.id,i);t+=Number(v)||0;mx+=j.max});var p=mx?Math.round(t*1000/mx)/10:0;return{s:s,t:t,mx:mx,p:p,g:gr(p),ok:p>=D.pass}});rows.sort(function(a,b){return b.t-a.t});rows.forEach(function(r,i){r.rk=i+1});return rows}
