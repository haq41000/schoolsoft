<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>SchoolSoft</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#14213d">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f2f5fb;--card:#fff;--tx:#1b2333;--mut:#667;--pri:#1e4fd8;--bd:#d9deea;--sd:#14213d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141d;--card:#1a2030;--tx:#eef1f8;--mut:#9aa4bb;--bd:#2c354a;--sd:#0a0f1c}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Arial,sans-serif}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sd);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top button{width:auto;margin:0;padding:6px 12px;background:#ffffff22}
.side{position:fixed;left:-240px;top:0;bottom:0;width:230px;background:var(--sd);padding:56px 8px 8px;transition:left .2s;z-index:4;overflow:auto}
.side.o{left:0}.side button{display:block;width:100%;text-align:left;background:transparent;color:#cfd8ee;margin:2px 0;padding:12px}
.side button.a{background:#ffffff22;color:#fff}
main{padding:14px;max-width:900px;margin:0 auto}
@media(min-width:800px){.side{left:0;padding-top:70px}main{margin-left:240px}.top{padding-left:250px}.top .mb{display:none}}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
h1{font-size:21px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}p{color:var(--mut);margin:4px 0}
label{display:block;margin:10px 0 4px;font-size:14px}
input,select,textarea{width:100%;padding:11px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button{width:100%;margin-top:10px;padding:12px;font-size:16px;border:0;border-radius:8px;background:var(--pri);color:#fff}
button.s{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g .c{margin:0}.g b{font-size:19px;display:block;margin-top:4px}
.t{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
td button{margin:0;padding:6px 10px;font-size:13px;width:auto}
.m{margin-top:10px;font-size:14px}.ok{color:#128a3e}.er{color:#d22}
.rc{border:2px dashed var(--bd);padding:14px}

.k{cursor:pointer}.pk{color:#1b2333}.pk b{color:#1b2333}
.side button.pc,.side button.pc.a{color:#1b2333;border-radius:8px}.side button.pc.a{outline:3px solid #fff;font-weight:700}
.wa{background:#25a244!important;color:#fff!important;border:0!important}
.at td{padding:13px 8px;font-size:16px}
</style></head><body><div id="app"></div>
<script>
var K="schoolsoft_v2",D=null,auth=false,V="dash",busy=false,RID=null;
function ld(){try{var r=localStorage.getItem(K);if(r){D=JSON.parse(r);return}var o=localStorage.getItem("schoolsoft_v1");if(o){var s=JSON.parse(o);D={school:s.school,currency:s.currency||"PKR",salt:s.salt,pw:s.pw,classes:[],students:[],charges:[],pays:[],seq:{reg:1,rec:1}};sv()}}catch(e){D=null}}
function sv(){try{localStorage.setItem(K,JSON.stringify(D));return true}catch(e){alert("Could not save data. Please do not use Private/Incognito mode.");return false}}
async function H(p,s){var t=s+":"+p;try{var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}catch(e){var h=5381;for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return "f"+h}}
function slt(){var s="";for(var i=0;i<16;i++)s+=Math.floor(Math.random()*16).toString(16);return s}
function $(i){return document.getElementById(i)}
var PC=["#e3f0ff","#e6f7ec","#fff3d6","#fde7ee","#efe6ff","#dff6f5","#ffe9dc","#eaf3d8","#e1e8ff","#fdf0d5","#f1e4f6","#dcf1f9","#ffe3e3"],MSGS=[],LICEXP="",CLK=true,LV="today",LB="dash",SRID=null,AT={},PD=null,PE=null;
function MM(id,t,ok){var m=$(id);if(m){m.className="m "+(ok?"ok":"er");m.textContent=t}}
function ph(p){var d=String(p||"").replace(/\D/g,"");if(!d)return"";if(d.indexOf("00")==0)d=d.slice(2);else if(d[0]=="0")d="92"+d.slice(1);else if(d.length==10&&d[0]=="3")d="92"+d;return d}
function mq(p,t){MSGS.push({p:p,t:t});return MSGS.length-1}
function snd(i,k){var m=MSGS[i];if(!m)return;var n=ph(m.p);if(!n){alert("No phone number saved for this person. Please add it first (Students > Edit).");return}window.open(k=="s"?"sms:+"+n+"?body="+encodeURIComponent(m.t):"https://wa.me/"+n+"?text="+encodeURIComponent(m.t),"_blank")}
function mw(p,t){var i=mq(p,t);return'<button class="wa np" onclick="snd('+i+',\'w\')">WhatsApp</button>'}
function mb(p,t){var i=mq(p,t);return'<button class="wa np" onclick="snd('+i+',\'w\')">Send to parent on WhatsApp</button><button class="s np" onclick="snd('+i+',\'s\')">Send as SMS</button>'}
function mFee(s){return"Assalam o Alaikum. Dear parent of "+s.name+" ("+cn(s.cid)+"), the pending fee is "+fm(pend(s.id))+". Please pay it at your earliest convenience. Thank you. - "+D.school}
function mRcp(p,s){return"Assalam o Alaikum. Dear parent of "+s.name+" ("+cn(s.cid)+"), we received "+fm(p.amt)+" on "+p.date+" (Receipt "+p.rno+"). Remaining balance: "+fm(pend(s.id))+". Thank you. - "+D.school}
function mAbs(s,d,st){return"Assalam o Alaikum. Dear parent, "+s.name+" ("+cn(s.cid)+") was "+(st=="V"?"on leave":"absent")+" on "+d+". - "+D.school}
function mAtt(s,m,n,pc){return"Assalam o Alaikum. Attendance of "+s.name+" ("+cn(s.cid)+") for "+m+": Present "+n.P+", Absent "+n.A+", Late "+n.L+", Leave "+n.V+(pc&&pc!="-"?" ("+pc+")":"")+". - "+D.school}
function mRes(e,r){return"Assalam o Alaikum. Result of "+r.s.name+" ("+cn(e.cid)+") in "+e.name+": "+r.t+"/"+r.mx+" ("+r.p+"%), Grade "+r.g+", Position "+r.rk+", "+(r.ok?"Pass":"Fail")+". - "+D.school}
function mSal(x,t){return"Assalam o Alaikum. Dear "+t.name+", your salary of "+fm(x.amt)+" for "+x.month+" was paid on "+x.date+" (Receipt "+x.rno+"). - "+D.school}
function ro(){return !!LICEXP&&LICEXP<today()}
function RO(){alert("Your license has expired. You can view your data, but you cannot add or change anything. Please renew in Settings > License.")}
function exb(){return'<div class="c pk" style="background:#ffe3e3"><b>Your license expired on '+LICEXP+'.</b> You can still view and print your data, but you cannot add or change anything. Please renew in Settings &gt; License.<button onclick="go(\'set\')">Renew license</button></div>'}
function dl(){return Math.ceil((new Date(LICEXP)-new Date(today()))/864e5)}
function lwarn(){if(!LICEXP||ro())return"";var d=dl();return d<=7?'<div class="c pk" style="background:#fff1cc"><b>Your license ends in '+d+' day(s) on '+LICEXP+'. Please renew (Settings > License).</b></div>':""}
function linfo(){return'<div class="c"><h2>License</h2><p>'+(LICEXP?(ro()?"Expired on <b>"+LICEXP+"</b>":"Valid until <b>"+LICEXP+"</b> ("+dl()+" days left)"):"Activated (no expiry date)")+'</p><p>Device ID: <b>'+devId()+'</b></p><p>To renew, send the Device ID to Haq on WhatsApp, then paste the new key here.</p><textarea id="lk" rows="3"></textarea><button class="s" onclick="actv()">Renew license</button></div>'}
function LM(){if(!CLK)return'<p class="er">Your phone date looks wrong. Set the correct date and time, then open the app again.</p>';if(LICEXP&&LICEXP<today())return'<p class="er">Your license expired on '+LICEXP+'. Please renew it.</p>';return""}
function E(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function M(t,ok){var m=$("m");if(m){m.className="m "+(ok?"ok":"er");m.textContent=t}}
function fm(n){return D.currency+" "+Number(n).toLocaleString()}
function today(){return new Date().toISOString().slice(0,10)}
function cn(id){var c=D.classes.filter(function(x){return x.id==id})[0];return c?c.name:"-"}
function pend(sid){var a=0;D.charges.forEach(function(c){if(c.sid==sid)a+=c.amt});D.pays.forEach(function(p){if(p.sid==sid)a-=p.amt+p.disc});return a}
var PUB={"kty":"EC","x":"8lld6xSOyXo-ETYMPAfobYVR1Kat6xFYawaVe6NMLVE","y":"nrY8aeIczGMQ6e1DVgtsZlU_DfSGA6Y6wv-09Jz7lQw","crv":"P-256"},LIC=false;
function devId(){try{var d=localStorage.getItem("schoolsoft_dev");if(!d){var a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",x="";for(var i=0;i<12;i++)x+=a[Math.floor(Math.random()*a.length)];d=x.slice(0,4)+"-"+x.slice(4,8)+"-"+x.slice(8);localStorage.setItem("schoolsoft_dev",d)}return d}catch(e){return"NO-STORAGE"}}
function b2u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function vsig(sig,msg){try{var key=await crypto.subtle.importKey("jwk",PUB,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);return await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,b2u(sig),new TextEncoder().encode(msg))}catch(e){return false}}
async function vlic(k){k=k.replace(/\s+/g,"");var i=k.indexOf(".");if(i<0)return{ok:await vsig(k,"SCHOOL|"+devId()),exp:""};var ex=k.slice(0,i);if(!/^\d{8}$/.test(ex)||!await vsig(k.slice(i+1),"SCHOOL|"+devId()+"|"+ex))return{ok:false,exp:""};var e=ex.slice(0,4)+"-"+ex.slice(4,6)+"-"+ex.slice(6);return{ok:e>=today(),exp:e}}
function seen(){try{var s=localStorage.getItem("schoolsoft_seen")||"",t=today();if(s&&t<s)return false;localStorage.setItem("schoolsoft_seen",t);return true}catch(e){return true}}
async function actv(){var k=$("lk").value.trim(),r=await vlic(k);if(r.ok){try{localStorage.setItem("schoolsoft_lic",k.replace(/\s+/g,""))}catch(e){}LIC=true;LICEXP=r.exp;R()}else M(r.exp?"This key has expired. Please ask Haq for a new key.":"This key is not correct for this device. Please copy the full key again.")}
async function initLic(){var k="";try{k=localStorage.getItem("schoolsoft_lic")||""}catch(e){}CLK=seen();var r=(k&&CLK)?await vlic(k):{ok:false,exp:""};LIC=r.ok||!!r.exp;LICEXP=r.exp;R()}
function R(){
 MSGS=[];var a=$("app");if(!LIC){a.innerHTML='<main><h1>Activate SchoolSoft</h1><div class="c"><h2>Your Device ID</h2><p style="font-size:22px;color:var(--tx)"><b>'+devId()+'</b></p>'+LM()+'<p>Send this Device ID to Haq on WhatsApp to get your activation key.</p><label>Activation key</label><textarea id="lk" rows="4"></textarea><button onclick="actv()">Activate</button><div id="m" class="m"></div></div></main>';return}if(D){["att","staff","spay","exams","marks","exp","papers"].forEach(function(k){if(!D[k])D[k]=[]});if(!D.gs)D.gs="80:A+,70:A,60:B,50:C,40:D,0:F";if(D.pass==null)D.pass=40;if(!D.seq.sr)D.seq.sr=1;D.spay.forEach(function(x){if(!x.rno){x.rno="SR-"+String(D.seq.sr).padStart(5,"0");D.seq.sr++}})}
 if(!D){a.innerHTML='<main><h1>Welcome to SchoolSoft</h1><div class="c"><h2>First-time setup</h2><label>School name</label><input id="n"><label>Create admin password (min 6)</label><input id="p" type="password"><label>Repeat password</label><input id="p2" type="password"><button onclick="setup()">Save and start</button><div id="m" class="m"></div><p>Currency: PKR</p></div></main>';return}
 if(!auth){a.innerHTML='<main><h1>'+E(D.school)+'</h1><div class="c"><h2>Login</h2><label>Admin password</label><input id="p" type="password"><button onclick="login()">Login</button><div id="m" class="m"></div></div></main>';return}
 var nav=[["dash","Dashboard"],["stu","Students"],["add","New Admission"],["att","Attendance"],["fee","Fee Collection"],["rec","Receipts"],["exm","Exams & Results"],["pap","Exam Papers"],["stf","Staff & Salary"],["exp","Expenses / Cashbook"],["cls","Classes"],["bak","Backup / Restore"],["set","Settings"]];
 a.innerHTML='<div class="top"><button class="mb" onclick="$(\'sd\').classList.toggle(\'o\')">☰</button><b>'+E(D.school)+'</b></div><div class="side" id="sd">'+nav.map(function(n,i){return'<button class="pc '+(V==n[0]?"a":"")+'" style="background:'+PC[i%PC.length]+'" onclick="go(\''+n[0]+'\')">'+n[1]+'</button>'}).join("")+'<button onclick="auth=false;R()">Logout</button></div><main id="mn"></main>';
 var f={dash:vDash,stu:vStu,add:vAdd,edt:vEdt,est:vEst,att:vAtt,exm:vExm,mk:vMk,rs:vRs,rc:vRc,stf:vStf,exp:vExp,fee:vFee,rec:vRec,cls:vCls,cle:vCle,prm:vPrm,bak:vBak,set:vSet,rcp:vRcp,lv:vLv,src:vSrc,pap:vPap,ppe:vPpe,ppp:vPpp}[V];$("mn").innerHTML=(ro()?exb():"")+f();if(V=="stu")lst();if(V=="fee"){fpick();cwl()}if(V=="att"&&D.classes.length){alist();arep()}}
function go(v){if(v=="lv")LB=V;V=v;R();window.scrollTo(0,0)}
async function setup(){var n=$("n").value.trim(),p=$("p").value;if(!n)return M("Please type the school name.");if(p.length<6)return M("Password must be at least 6 characters.");if(p!==$("p2").value)return M("Passwords do not match.");var s=slt();D={school:n,currency:"PKR",salt:s,pw:await H(p,s),classes:[],students:[],charges:[],pays:[],seq:{reg:1,rec:1}};if(!sv()){D=null;return}auth=true;R()}
async function login(){if(await H($("p").value,D.salt)===D.pw){auth=true;R()}else M("Wrong password.")}
async function chk(id){return (await H($(id).value,D.salt))===D.pw}
function vDash(){var t=today(),mo=t.slice(0,7),td=0,tm=0,pd=0,df=0,sm=0,xm=0;D.pays.forEach(function(p){if(p.date==t)td+=p.amt;if(p.date.slice(0,7)==mo)tm+=p.amt});D.students.forEach(function(s){var x=pend(s.id);if(x>0){pd+=x;df++}});D.spay.forEach(function(x){if(x.date.slice(0,7)==mo)sm+=x.amt});D.exp.forEach(function(x){if(x.date.slice(0,7)==mo)xm+=x.amt});
 var pr=D.att.filter(function(a){return a.d==t&&(a.st=="P"||a.st=="L")}).length;
 function cd(l,v,g,i){return'<div class="c pk k" style="background:'+PC[i%PC.length]+'" onclick="'+g+'">'+l+'<b>'+v+'</b></div>'}
 return'<h1>Dashboard</h1>'+lwarn()+'<p>Tap any box to see the full details.</p><div class="g">'+cd("Students",D.students.filter(function(s){return !s.left}).length,"go('stu')",0)+cd("Classes",D.classes.length,"go('cls')",1)+cd("Today collection",fm(td),"LV='today';go('lv')",2)+cd("This month",fm(tm),"LV='month';go('lv')",3)+cd("Total pending",fm(pd),"LV='pend';go('lv')",4)+cd("Defaulters",df,"LV='pend';go('lv')",5)+cd("Salary paid (month)",fm(sm),"LV='salm';go('lv')",6)+cd("Other expenses (month)",fm(xm),"LV='expm';go('lv')",7)+cd("Present today",pr,"go('att')",8)+'</div><div class="c" style="margin-top:14px"><h2>Quick start</h2><p>1) Add classes 2) Admit students 3) Generate monthly fees 4) Collect fee.</p></div>'}
var ECID=null,PF="";
function gp(){PF="";go("prm")}
function ec(id){ECID=id;go("cle")}
function pfs(v){PF=v;go("prm")}
function vCls(){return'<h1>Classes</h1><div class="c"><label>New class name (e.g. Class 1)</label><input id="cname"><button onclick="addCls()">Add class</button><div id="m" class="m"></div></div><div class="c"><h2>New school year</h2><p>Move students to the next class, or mark class 10 as passed out.</p><button class="s" onclick="gp()">Promote students</button></div><div class="c t"><table><tr><th>Class</th><th>Students</th><th></th></tr>'+D.classes.map(function(c){return'<tr><td>'+E(c.name)+'</td><td>'+D.students.filter(function(s){return s.cid==c.id&&!s.left}).length+'</td><td><button onclick="ec('+c.id+')">Edit</button></td></tr>'}).join("")+'</table></div>'}
function vCle(){var c=D.classes.filter(function(x){return x.id==ECID})[0];if(!c)return'<h1>Edit class</h1><div class="c"><p>Class not found.</p></div><button class="s" onclick="go(\'cls\')">Back to classes</button>';return'<h1>Edit class</h1><div class="c"><label>Class name</label><input id="cn2" value="'+E(c.name)+'"><button onclick="saveCle()">Save changes</button><div id="m" class="m"></div></div><button class="s" onclick="go(\'cls\')">Back to classes</button>'}
function saveCle(){var n=$("cn2").value.trim();if(!n)return M("Type a class name.");if(D.classes.some(function(c){return c.id!=ECID&&c.name.toLowerCase()==n.toLowerCase()}))return M("Another class already has this name.");D.classes.filter(function(c){return c.id==ECID})[0].name=n;if(sv())go("cls")}
function vPrm(){var h='<h1>Promote students</h1><div class="c"><p>Do the highest class first (for example Class 9 to Class 10), then work down. Untick any student who failed, so he or she stays in the same class.</p><label>Promote students of this class</label><select id="pf" onchange="pfs(this.value)"><option value="">Choose class</option>'+D.classes.map(function(c){return'<option value="'+c.id+'"'+(c.id==PF?" selected":"")+'>'+E(c.name)+'</option>'}).join("")+'</select></div>';if(!PF)return h+'<button class="s" onclick="go(\'cls\')">Back to classes</button>';var st=D.students.filter(function(s){return s.cid==PF&&!s.left});if(!st.length)return h+'<div class="c"><p>No students in this class.</p></div><button class="s" onclick="go(\'cls\')">Back to classes</button>';return h+'<div class="c"><label>Move them to</label><select id="pt"><option value="">Choose</option>'+D.classes.filter(function(c){return c.id!=PF}).map(function(c){return'<option value="'+c.id+'">'+E(c.name)+'</option>'}).join("")+'<option value="G">Passed out (leaves school)</option></select><div class="t"><table><tr><th></th><th>Reg</th><th>Student</th></tr>'+st.map(function(s){return'<tr><td><input type="checkbox" id="pk_'+s.id+'" checked style="width:22px;height:22px"></td><td>'+s.reg+'</td><td>'+E(s.name)+'</td></tr>'}).join("")+'</table></div><button onclick="doPrm()">Promote ticked students</button><div id="m" class="m"></div></div><button class="s" onclick="go(\'cls\')">Back to classes</button>'}
function doPrm(){var t=$("pt").value;if(!t)return M("Choose where to move them.");var st=D.students.filter(function(s){return s.cid==PF&&!s.left&&$("pk_"+s.id)&&$("pk_"+s.id).checked});if(!st.length)return M("No student is ticked.");var g=t=="G",tn=g?"Passed out":cn(t);if(!g){var ex=D.students.filter(function(s){return s.cid==t&&!s.left}).length;if(ex&&!confirm(tn+" already has "+ex+" students. Move anyway? (Tip: promote the higher class first.)"))return}if(!confirm("Move "+st.length+" student(s) from "+cn(PF)+" to "+tn+"?"))return;st.forEach(function(s){if(g){s.left=true;s.grad=true;s.gcid=s.cid;s.gdate=today()}else s.cid=t});if(sv()){alert(st.length+" student(s) moved to "+tn+".");PF="";go("prm")}}
function vLv(){var t=today(),mo=t.slice(0,7),h="",ti="",tot=0,cnt=0,mn=(LV=="salm"||LV=="expm");
 function sn(id){return D.students.filter(function(x){return x.id==id})[0]||{name:"?"}}
